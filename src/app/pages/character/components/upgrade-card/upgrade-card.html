<div
  class="flex h-full flex-col justify-between gap-5 border-2 border-main-cyan/40 bg-main-cyan-muted/10 p-6 font-mono text-white transition-colors"
  [class.opacity-60]="!canPurchase()"
  [class.border-main-cyan]="canPurchase()"
  [class.bg-main-cyan-muted]="canPurchase()"
>
  <div>
    <div class="flex items-start justify-between gap-4">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center border border-main-cyan/60 text-lg text-main-cyan">
        +
      </div>
      <div class="text-right">
        <p class="text-xs tracking-[0.2em] text-main-cyan-muted">LVL. {{ upgrade().currentLevel }}</p>
        <p class="mt-1 text-lg leading-tight">{{ upgrade().name }}</p>
      </div>
    </div>

    <div class="mt-4 grid grid-cols-2 gap-3 text-xs">
      <div>
        <p class="tracking-[0.15em] text-main-cyan-muted">CURRENT EFFECT</p>
        <p class="mt-2 text-main-cyan">{{ currentEffect() }}</p>
      </div>
      <div class="text-right">
        <p class="tracking-[0.15em] text-main-cyan-muted">NEXT LEVEL</p>
        <p class="mt-2 text-white/80">{{ nextEffect() }}</p>
      </div>
    </div>

    <p class="mt-4 text-[0.65rem] tracking-[0.12em] text-main-cyan-muted">
      {{ effectPerLevel() }} EACH LEVEL
    </p>
  </div>

  <button
    type="button"
    class="w-full border border-main-cyan bg-dark-bg py-4 text-main-cyan transition-colors hover:bg-main-cyan hover:text-dark-bg disabled:cursor-not-allowed disabled:border-main-cyan/30 disabled:bg-main-cyan-muted/10 disabled:text-main-cyan-muted disabled:hover:bg-main-cyan-muted/10 disabled:hover:text-main-cyan-muted"
    [disabled]="!canPurchase()"
    (click)="purchase.emit()"
  >
    <div class="flex justify-between px-2 text-sm">
      @if (canPurchase()) {
        <span>Upgrade</span>
      } @else {
        <span>Insufficient funds</span>
      }
      <span>{{ currentCost() | BigDecimalFormat }} {{ label() }}</span>
    </div>
  </button>
</div>
